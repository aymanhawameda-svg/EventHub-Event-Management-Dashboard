<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EventHub - Event Management Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="script.js" defer></script>

    <script
      type="module"
      src="https://unpkg.com/cally"
    ></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-base-200 min-h-screen text-base-content">
    <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
      <!-- ---header--- -->
      <header class="navbar bg-base-100 rounded-box shadow-md px-4">
        <div class="flex-1">
          <a class="btn btn-ghost text-xl font-bold text-primary">EventHub</a>
        </div>
        <div class="flex-none gap-2">
          <div class="dropdown dropdown-end">
            <div
              tabindex="0"
              role="button"
              class="btn btn-ghost btn-circle avatar"
            >
              <div class="w-10 rounded-full">
                <img
                  alt="User Avatar"
                  src="image/walls-io-laKGzDrzVaI-unsplash.jpg"
                />
              </div>
            </div>
          </div>
        </div>
      </header>
      <!-- ---------- -->
      <section
        class="stats shadow w-full bg-base-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2"
      >
        <div class="stat">
          <div class="stat-figure text-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-8 h-8 stroke-current"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
          </div>
          <div class="stat-title">Events</div>
          <div class="stat-value text-primary" id="stat-total">12</div>
        </div>

        <div class="stat">
          <div class="stat-figure text-success">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-8 h-8 stroke-current"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>
          <div class="stat-title">Offene Events</div>
          <div class="stat-value text-success" id="stat-open">6</div>
        </div>

        <div class="stat">
          <div class="stat-figure text-info">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-8 h-8 stroke-current"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
              ></path>
            </svg>
          </div>
          <div class="stat-title">Teilnehmer</div>
          <div class="stat-value text-info" id="stat-participants">143</div>
        </div>

        <div class="stat">
          <div class="stat-figure text-error">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-8 h-8 stroke-current"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              ></path>
            </svg>
          </div>
          <div class="stat-title">Ausgebuchte Events</div>
          <div class="stat-value text-error" id="stat-full">3</div>
        </div>
      </section>
      <section
        class="bg-base-100 p-4 rounded-box shadow-md flex flex-wrap gap-3 items-center justify-between"
      >
        <div class="flex flex-wrap gap-3 items-center flex-1">
          <!-- Search -->
          <input
            type="text"
            id="searchInput"
            placeholder="Suche nach Event..."
            class="input input-bordered w-full sm:w-auto flex-1 max-w-xs"
          />

          <!--  Filter -->
          <select id="categoryFilter" class="select select-bordered">
            <option value="Alle">Kategorie: Alle</option>
            <option value="Workshop">Workshop</option>
            <option value="Meetup">Meetup</option>
            <option value="Schulung">Schulung</option>
            <option value="Networking">Networking</option>
            <option value="Intern">Intern</option>
          </select>

          <!-- Status Filter -->
          <select id="statusFilter" class="select select-bordered">
            <option value="Alle">Status: Alle</option>
            <option value="Offen">Offen</option>
            <option value="Geplant">Geplant</option>
            <option value="Ausgebucht">Ausgebucht</option>
            <option value="Abgeschlossen">Abgeschlossen</option>
          </select>
          <!-- Sort -->
          <select id="sortFilter" class="select select-bordered">
            <option value="date-asc">Datum aufsteigend</option>
            <option value="date-desc">Datum absteigend</option>
            <option value="title-asc">Titel A–Z</option>
          </select>
        </div>

        <!-- Add Button -->

        <button id="newEvent" class="btn btn-primary">
  + Neues Event
</button>
      </section>

        <section class="modal-section">
      <dialog id="new_task" class="modal">
        <div class="modal-box">

          <form method="dialog">
            <button
              class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
            >
              ✕
            </button>
          </form>

          <h3 class="text-lg font-bold">
            Neues Element
          </h3>

          <form id="new-task-form">

            <!-- Title -->
            <fieldset class="fieldset">
              <label
                class="label"
                for="title"
              >
                Title
              </label>

              <input
                type="text"
                id="title"
                class="input"
                placeholder="Title"
                name="title"
              />
            </fieldset>


        
            <fieldset class="fieldset">
              <label
                class="label"
                for="description"
              >
                Beschreibung
              </label>

              <input
                type="text"
                id="description"
                class="input"
                placeholder="Beschreibung"
                name="description"
              />
            </fieldset>


        
            <fieldset class="fieldset">
              <label
                class="label"
                for="date"
                id="date"
              >
                Datum *
              </label>

              <input
                type="date"
                class="input"
              />

              <calendar-date
                id="calendar"
                hidden
                class="cally bg-base-100 border border-base-300 shadow-lg rounded-box"
              >

                <svg
                  aria-label="Previous"
                  class="fill-current size-4"
                  slot="previous"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="M15.75 19.5 8.25 12l7.5-7.5"
                  ></path>
                </svg>

                <svg
                  aria-label="Next"
                  class="fill-current size-4"
                  slot="next"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="m8.25 4.5 7.5 7.5-7.5 7.5"
                  ></path>
                </svg>

                <calendar-month></calendar-month>

              </calendar-date>
            </fieldset>


            <fieldset class="fieldset">

                <legend class="fieldset-legend">
                Uhrzeit *
              </legend>

              <input
                type="time"
                class="input"
                id="time"
              />

              

            </fieldset>


           
            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Ort *
              </legend>

              <input
                type="text"
                class="input"
                placeholder="z. B. Hamburg"
              />

            </fieldset>


        
            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Kathegorie *
              </legend>

              <input
                type="text"
                class="input"
                placeholder="z. B. Hamburg"
              />

            </fieldset>


            <!-- Teilnehmer -->
            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Teilnehmer *
              </legend>

              <div class="join">

                <input
                  class="input join-item"
                  placeholder="1"
                />

                <button
                  class="btn join-item"
                >
                  +
                </button>

                <button
                  class="btn join-item"
                >
                  -
                </button>

              </div>

            </fieldset>


            <!-- Erstellen -->
            <div class="mt-6">

              <button
                type="submit"
                class="btn btn-primary"
              >
                Erstellen
              </button>

            </div>

          </form>
        </div>
      </dialog>
    </section>

    <section class="modal-section">
      <dialog id="änderungstask_task" class="modal">
        <div class="modal-box">

          <form method="dialog">
            <button
              class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
            >
              ✕
            </button>
          </form>

          <h3 class="text-lg font-bold">
            Event bearbeiten
          </h3>

          <form id="edit-task-form">

            <fieldset class="fieldset">
              <label
                class="label"
                for="edit-title"
              >
                Title
              </label>

              <input
                type="text"
                id="edit-title"
                class="input"
                placeholder="Title"
                name="title"
              />
            </fieldset>


            <fieldset class="fieldset">
              <label
                class="label"
                for="edit-description"
              >
                Beschreibung
              </label>

              <input
                type="text"
                id="edit-description"
                class="input"
                placeholder="Beschreibung"
                name="description"
              />
            </fieldset>


            <fieldset class="fieldset">
              <label
                class="label"
                for="edit-date"
              >
                Datum *
              </label>

              <input
                type="date"
                id="edit-date"
                class="input"
              />

              <calendar-date
                id="edit-calendar"
                hidden
                class="cally bg-base-100 border border-base-300 shadow-lg rounded-box"
              >

                <svg
                  aria-label="Previous"
                  class="fill-current size-4"
                  slot="previous"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="M15.75 19.5 8.25 12l7.5-7.5"
                  ></path>
                </svg>

                <svg
                  aria-label="Next"
                  class="fill-current size-4"
                  slot="next"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="m8.25 4.5 7.5 7.5-7.5 7.5"
                  ></path>
                </svg>

                <calendar-month></calendar-month>

              </calendar-date>
            </fieldset>


            <fieldset class="fieldset">

              <input
                type="time"
                id="edit-time"
                class="input"
              />

              <legend class="fieldset-legend">
                Uhrzeit *
              </legend>

            </fieldset>


            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Ort *
              </legend>

              <input
                type="text"
                id="edit-location"
                class="input"
                placeholder="z. B. Hamburg"
              />

            </fieldset>


            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Kathegorie *
              </legend>

              <input
                type="text"
                id="edit-category"
                class="input"
                placeholder="z. B. Hamburg"
              />

            </fieldset>


            <fieldset class="fieldset">

              <legend class="fieldset-legend">
                Teilnehmer *
              </legend>

              <div class="join">

                <input
                  class="input join-item"
                  placeholder="1"
                />

                <button
                  class="btn join-item"
                >
                  +
                </button>

                <button
                  class="btn join-item"
                >
                  -
                </button>

              </div>

            </fieldset>


            <div class="mt-6">

              <button
                type="submit"
                class="btn btn-primary"
              >
                Änderungen speichern
              </button>

            </div>

          </form>
        </div>
      </dialog>
    </section>

    <main
  id="eventsContainer"
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
></main>

  </body>
</html>
